apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateful-flask
  namespace: gestion-tache
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stateful-flask
  template:
    metadata:
      labels:
        app: stateful-flask
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'until nc -z postgres.postgres.svc.cluster.local 5432; do sleep 3; done'
      containers:
        - name: stateful-flask
          image: ikasospa/stateful-flask:v0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: gestion-tache-lb
  namespace: gestion-tache
spec:
  type: LoadBalancer
  selector:
    app: stateful-flask
  ports:
    - port: 5000
      targetPort: 5000
