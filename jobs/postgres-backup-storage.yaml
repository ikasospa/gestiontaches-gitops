# Sur le nœud qui accueille les sauvegardes, au préalable :
#   ssh k8s-worker1 -c "sudo mkdir -p /mnt/data/postgres-backups"
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-backup-pv
spec:
  storageClassName: manual-backup
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/data/postgres-backups
    nodeAffinity:
      required:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [k8s-worker1]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: postgres
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: manual-backup
  resources:
    requests:
      storage: 5Gi
