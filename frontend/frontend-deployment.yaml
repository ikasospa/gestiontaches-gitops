apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gestion-tache
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ikasospa/frontend:v0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Lue depuis le ConfigMap plutôt qu'écrite en dur ici : changer
            # l'IP du LoadBalancer stateful-flask-lb ne touche plus au
            # Deployment, seulement au ConfigMap (voir 01-frontend-configmap.yaml).
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: API_BASE_URL
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          resources:
            # Le HPA calcule un pourcentage d'utilisation par rapport à cette
            # valeur de requests.cpu : sans elle, le HPA ne peut rien calculer.
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-config
            items:
              - key: nginx.conf
                path: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-lb
  namespace: gestion-tache
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
