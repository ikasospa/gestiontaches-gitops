<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks — stateful-flask</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Gestion des tâches</h1>
      <p class="sub">Frontend SPA — namespace <code>frontend</code> → API <code>stateful-flask</code></p>
    </header>
 
    <section class="status" id="status"></section>
 
    <form id="task-form">
      <input type="hidden" id="task-id" />
      <input type="text" id="title" placeholder="Titre" required />
      <input type="text" id="description" placeholder="Description (optionnel)" />
      <button type="submit" id="submit-btn">Ajouter</button>
      <button type="button" id="cancel-btn" class="ghost hidden">Annuler</button>
    </form>
 
    <table>
      <thead>
        <tr><th>ID</th><th>Titre</th><th>Description</th><th>Pod</th><th>Actions</th></tr>
      </thead>
      <tbody id="task-list"></tbody>
    </table>
  </div>
 
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
